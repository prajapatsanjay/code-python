<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay</title>

    <style>
        .video {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <img src="img.svg" alt="my saved iframe">

    <!-- YouTube nocookie iframe -->
    <iframe
        class="video"
        src="https://www.youtube-nocookie.com/embed/SCGm5lg6a0g"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

    <br><br>

    <img src="2img.svg" alt="my saved iframe">

    <!-- YouTube start time iframe -->
    <iframe
        class="video"
        src="https://www.youtube.com/embed/nvmc2ECk8Lo?start=825"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>

</body>
</html>
