<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* The specificity if this selector is 1 */
        h1{
            color: aqua;
        }
        /* The specificity of this selector is 10 */
        .cpurple{
            color: purple;
        }

        /* The specificity of this selector is 1 + 10 = 11 */
        h1.yellow{
            color: yellow;
        }
        /* The specificity of this selector is 10 */ 
        .red{
            color: fuchsia;
        }
        
        /* This is an example of attribute selector. The specificity of this selector is 10 */
        [data-x="a"]{
            color:violet ;
        } 

        /* The specificity of this selector is  total = 1 + 10 + 10 + 10 + 10 = 41 */
        a.harryclass.rohon-class[href]:hover{
            color: hotpink;
        }
    </style>
</head>

<body>
    <div>
        <h1 class="yellow cred cpurple" data-x="a">css specificity</h1>
    </div>
</body>

</html>
