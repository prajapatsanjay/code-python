<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Card Design</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap");
      body {
        background-color: #f2f2f2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
      }
      body{
        background-color: gray;
        padding: 45;
        display: flex;
      }
      .card {
        background-color: white;
        width: 198px;
        border-radius: 7px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        overflow: auto;
        margin:  4px;
      }

      .image {
        padding: 5px;
      }

      .image img {
        width: 100%;
        border-radius: 7px;
      }

      .capsules {
        padding: 7px  13px;
font-family: 'poppins', sans-serif;        
      }

      .capsules span {
        border: 2px solid gray;
        padding: 0px 8px;
        border-radius: 12px;
        font-size: 12px;
        margin-right: 0px;
      }
      .button{
        text-align: center;
      }
      .button button{
        padding: 7px 9px;
        border-radius: 9px;
        background-color: rgb(153, 153, 223);
        color: #3b6be5;
        font-size: 15px;
        margin-top: 4px;
        border: none;
        font-weight: bold;
        cursor: pointer;

      }

      .content {
        padding: 13px;
        font-family: "Dancing Script", cursive;
        font-optical-sizing: auto;
        font-weight: 400; /* try 400, 500, 600, 700 */
        font-style: normal;
      }

      .content p {
        font-size: 12px;
        color: #555;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <div class="image">
        <img
          src="https://images.unsplash.com/photo-1556195332-95503f664ced?q=80&w=1036&auto=format&fit=crop"
          alt="Nature"
        />
      </div>

      <div class="capsules">
        <span>Nature</span>
        <span>Lake</span>
      </div>

      <div class="content">
        <h3>Harry</h3>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit.
          Exercitationem impedit accusamus.
        </p>
      </div>
      <div class="button">
        <button>Read more</button>
      </div>

    </div>
  </body>
